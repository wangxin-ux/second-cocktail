# Example only. Replace YOUR_DOMAIN and configure HTTPS certificates outside this file.
# Nginx, Caddy, or Traefik may be used; this is not a production certificate configuration.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # After HTTPS is configured, redirect this server block to HTTPS.
    # return 301 https://$host$request_uri;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
