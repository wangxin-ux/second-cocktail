services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: second
      POSTGRES_USER: second
      POSTGRES_PASSWORD: second_dev_only
    ports:
      - "5432:5432"
    volumes:
      - second_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second -d second"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  second_postgres_data:
